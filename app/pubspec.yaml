name: kormo_app
description: "Kormo - Production Grade Office Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1

  # Backend: Supabase Client Single Source of Truth
  supabase_flutter: ^2.6.0

  # Typography, Theming & Date formatting
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Attendance Geofence & Mobile Hardware
  geolocator: ^12.0.0
  local_auth: ^2.2.0

  # Files, CSV & PDF Reporting
  file_picker: ^8.0.5
  csv: ^6.0.0
  pdf: ^3.10.8
  printing: ^5.13.1

  # Local Storage & Offline Cache
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
